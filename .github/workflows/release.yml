name: Release

# Tag-driven: push a v* tag and this builds the sidecar, packages the renderer
# into an Electron installer, and attaches both to a GitHub prerelease.
#
# There is no automatic versioning here on purpose. A release is a decision, and
# the tag is that decision made explicit.
#
# Release notes live in docs/releases/<tag>.md and are passed in with
# `body-path`, not written into this file as a block scalar. Prose with Markdown
# lists inside YAML is a trap: the parser rejects the whole workflow, and the
# failure is a zero-job red X with no message. Keeping the notes in a file also
# means they are reviewable content rather than something hidden in a
# `run:` block.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish a release for
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: electron/package-lock.json

      # Refuse to publish a version the source does not agree with. The tag, the
      # Directory.Build.props Version and electron/package.json version have all
      # drifted apart before, and a release that reports the wrong version is
      # worse than no release.
      #
      # The tag comes from the ref on a push and from the dispatch input on a
      # manual run, because `ref_name` is "main" in that case. It is then emitted
      # as a job output so the publish step cannot disagree with this check about
      # which tag is being released.
      - name: Resolve and verify the tag
        id: tag
        shell: pwsh
        run: |
          $fromRef = "${{ github.ref }}"
          if ($fromRef -like 'refs/tags/*') {
            $tag = $fromRef.Substring('refs/tags/'.Length)
          }
          else {
            $tag = "${{ github.event.inputs.tag }}"
          }

          if ([string]::IsNullOrWhiteSpace($tag)) {
            Write-Error 'No tag given: neither the ref nor the dispatch input carried one.'
            exit 1
          }
          if (-not $tag.StartsWith('v')) {
            $tag = "v$tag"
          }
          $expected = $tag.Substring(1)

          [xml]$props = Get-Content Directory.Build.props
          $dotnetVersion = ($props.Project.PropertyGroup.Version | Where-Object { $_ })

          $package = Get-Content electron/package.json -Raw | ConvertFrom-Json
          $npmVersion = $package.version

          Write-Host "tag             : $tag"
          Write-Host "Directory.Build : $dotnetVersion"
          Write-Host "package.json    : $npmVersion"

          if ($dotnetVersion -ne $expected) {
            Write-Error "Directory.Build.props says '$dotnetVersion' but the tag is '$expected'."
            exit 1
          }
          if ($npmVersion -ne $expected) {
            Write-Error "electron/package.json says '$npmVersion' but the tag is '$expected'."
            exit 1
          }

          $notes = "docs/releases/$tag.md"
          if (-not (Test-Path $notes)) {
            Write-Error "$notes is missing. Write the release notes before tagging."
            exit 1
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT

          # Explicit so a clean run does not inherit the exit code of the last
          # native command, which would be 1 from a Test-Path that found nothing.
          exit 0

      - name: Verify the required release documents exist
        run: |
          $required = @('LICENSE','PRIVACY.md','SECURITY.md','CHANGELOG.md','CONTRIBUTING.md')
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            Write-Error "Missing: $($missing -join ', ')"
            exit 1
          }
          Write-Host "All required documents present."
          exit 0

      - name: Verify build and tests before packaging
        run: |
          dotnet restore AIClient.slnx
          dotnet build AIClient.slnx --no-restore -warnaserror
          dotnet test AIClient.slnx --no-build

      - name: Publish the sidecar
        run: >
          dotnet publish src/AIClient.Server
          -c Release
          -r win-x64
          --self-contained false
          -o electron/sidecar

      - name: Install renderer dependencies
        working-directory: electron
        run: npm ci

      - name: Build renderer
        working-directory: electron
        run: npm run build:renderer

      # electron-builder picks the sidecar up through extraResources, so it has
      # to be a single directory beside the manifest. Verified here rather than
      # discovered by a user whose installer starts to a window that never loads
      # data.
      - name: Verify the sidecar output
        run: |
          if (-not (Test-Path electron/sidecar/AIClient.Server.exe)) {
            Write-Error 'electron/sidecar/AIClient.Server.exe is missing; the installer would ship without a backend.'
            exit 1
          }
          Get-ChildItem electron/sidecar | Select-Object Name, Length
          exit 0

      - name: Package the installer
        working-directory: electron
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect artefacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Get-ChildItem electron/release -Filter '*.exe' |
            Where-Object { $_.Name -notlike '*unins*' } |
            ForEach-Object { Copy-Item $_.FullName "release-assets/$($_.Name)" }
          Get-ChildItem electron/release -Filter '*.blockmap' -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName "release-assets/$($_.Name)" }
          $assets = Get-ChildItem release-assets
          if ($assets.Count -eq 0) {
            Write-Error 'electron-builder produced no .exe. Nothing would be attached to the release.'
            exit 1
          }
          $assets | Select-Object Name, Length
          exit 0

      - name: Upload build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets
          retention-days: 7

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest

    steps:
      # Downloaded into a directory named differently from the artifact, because
      # upload-artifact can preserve the source directory name inside the archive and
      # the result lands one level deeper than the name suggests. The step below
      # normalises whatever arrived rather than assuming a depth.
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: assets

      - name: Normalise and verify the artefacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          # Whatever depth the installer arrived at, flatten it.
          find assets -type f \( -name '*.exe' -o -name '*.blockmap' -o -name '*.yml' \) \
            -exec mv -f {} release-assets/ \;

          echo "--- collected ---"
          ls -la release-assets/

          # A release published with no installer is worse than no release: the
          # download link resolves and delivers nothing. This ran once already —
          # the publish step reported success while matching zero files, because
          # the glob quietly matched nothing.
          if ! ls release-assets/*.exe >/dev/null 2>&1; then
            echo "::error::No .exe installer found in the artefact. Refusing to publish an empty release."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          # Checked out at the tag, not at the branch, so body-path resolves
          # against the tree that is actually being published.
          ref: ${{ needs.build.outputs.tag }}

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: Kontur Code ${{ needs.build.outputs.tag }}
          prerelease: true
          body-path: docs/releases/${{ needs.build.outputs.tag }}.md
          files: |
            release-assets/*
          # The default is to warn and carry on, which is how a release with zero
          # assets gets published looking like a success.
          fail_on_unmatched_files: true