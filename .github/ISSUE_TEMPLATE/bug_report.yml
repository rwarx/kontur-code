name: Bug report

description: Something does not work the way it says it does
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks. The log file is the single most useful thing you can attach — see
        the last field. Please do not paste conversation content into a public issue.

  - type: input
    id: version
    attributes:
      label: Version
      description: Shown at the bottom-left of the title bar.
      placeholder: v0.1.0-alpha
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - GitHub installer (.exe)
        - dotnet run from a clone
        - Published build
        - Other
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered, starting from launch.
      render: text

  - type: textarea
    id: log
    attributes:
      label: Contents of the newest log file
      description: |
        %APPDATA%\AIClient\logs\ — the newest aiclient-<date>.log
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I read SECURITY.md — this is not a security vulnerability
        - label: I read DEVELOPMENT.md § Troubleshooting and the problem is not listed there
        - label: I did not include any API key in this report

  - type: textarea
    id: anything
    attributes:
      label: Anything else?